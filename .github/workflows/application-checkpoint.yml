name: application-checkpoint

on:
  push:
    branches:
      - editorial/apply-fourth-fifth-reports
    paths:
      - 'work/CHECKPOINT-REQUEST.json'
      - '.github/workflows/application-checkpoint.yml'
  pull_request:
    branches:
      - editorial/apply-fourth-fifth-reports
    paths:
      - 'work/CHECKPOINT-REQUEST.json'

permissions:
  contents: write

jobs:
  checkpoint:
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: editorial/apply-fourth-fifth-reports
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply checkpoint metadata
        run: |
          set -euo pipefail
          script=$(python -c "import json;print(json.load(open('work/CHECKPOINT-REQUEST.json'))['script'])")
          python "$script"
          python - <<'PY'
          import json
          from pathlib import Path
          req=json.loads(Path('work/CHECKPOINT-REQUEST.json').read_text(encoding='utf-8'))
          rows=[json.loads(x) for x in Path('work/application-ledger.jsonl').read_text(encoding='utf-8').splitlines() if x.strip()]
          assert len(rows)==210
          m={(r.get('id') or f"{r['report']}-{int(r['item_number']):03d}"):r for r in rows}
          state=Path('work/APPLICATION-STATE.md').read_text(encoding='utf-8')
          handoff=Path('work/NEXT-HANDOFF.md').read_text(encoding='utf-8')
          log=Path('work/VALIDATION-LOG.md').read_text(encoding='utf-8')
          assert req['validation_marker'] in log
          if req.get('last_f5') is not None:
              last=int(req['last_f5']); nxt_raw=req.get('next_f5'); nxt=int(nxt_raw) if nxt_raw is not None else None
              assert all(m[f'F4-{n:03d}']['status']!='PENDING' for n in range(1,117))
              assert all(m[f'F5-{n:03d}']['status'] not in (None,'PENDING','HOLD','FAILED') for n in range(1,last+1))
              assert 'Current phase: `FIFTH_APPLY`' in state
              assert f'Last fully completed Fifth Report item: `F5-{last:03d}`' in state
              assert f'DO-NOT-REPEAT Fifth: `F5-001`–`F5-{last:03d}`' in handoff
              if nxt is not None:
                  assert m[f'F5-{nxt:03d}']['status']=='PENDING'
                  assert f'Next Fifth Report item: `F5-{nxt:03d}`' in state
              else:
                  assert all(m[f'F5-{n:03d}']['status']!='PENDING' for n in range(1,95))
                  assert 'Next Fifth Report item: none — Fifth Report item application complete' in state
          else:
              last=int(req['last_f4']); nxt_raw=req.get('next_f4'); nxt=int(nxt_raw) if nxt_raw is not None else None
              assert all(m[f'F4-{n:03d}']['status']!='PENDING' for n in range(1,last+1))
              assert f'Last fully completed Fourth Report item: `F4-{last:03d}`' in state
              if nxt is not None:
                  assert m[f'F4-{nxt:03d}']['status']=='PENDING'
                  assert f'Next Fourth Report item: `F4-{nxt:03d}`' in state
              else:
                  assert all(m[f'F4-{n:03d}']['status']!='PENDING' for n in range(1,117))
                  assert 'Next Fourth Report item: none — Fourth Report application complete' in state
                  assert f"Current phase: `{req.get('next_phase','FOURTH_VALIDATE')}`" in state
                  assert f'DO-NOT-REPEAT: `F4-001`–`F4-{last:03d}`' in handoff
          PY
      - name: Commit checkpoint
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add work/application-ledger.jsonl work/APPLICATION-STATE.md work/VALIDATION-LOG.md work/NEXT-HANDOFF.md
          if git diff --cached --quiet; then exit 0; fi
          checkpoint=$(python -c "import json;print(json.load(open('work/CHECKPOINT-REQUEST.json'))['checkpoint'])")
          git commit -m "checkpoint(application): complete ${checkpoint} [skip ci]"
          git push origin HEAD:editorial/apply-fourth-fifth-reports
