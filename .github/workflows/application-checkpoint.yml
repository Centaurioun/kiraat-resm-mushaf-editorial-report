name: application-checkpoint

on:
  push:
    branches:
      - editorial/apply-fourth-fifth-reports
    paths:
      - 'work/CHECKPOINT-REQUEST.json'
      - '.github/workflows/application-checkpoint.yml'

permissions:
  contents: write

jobs:
  checkpoint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: editorial/apply-fourth-fifth-reports
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply checkpoint metadata
        run: |
          set -euo pipefail
          python work/checkpoint_f4_052.py
          python - <<'PY'
          import json
          from pathlib import Path
          rows=[json.loads(x) for x in Path('work/application-ledger.jsonl').read_text(encoding='utf-8').splitlines() if x.strip()]
          assert len(rows)==210
          m={(r.get('id') or f"{r['report']}-{int(r['item_number']):03d}"):r for r in rows}
          assert all(m[f'F4-{n:03d}']['status']!='PENDING' for n in range(1,53))
          assert m['F4-053']['status']=='PENDING'
          assert 'Last fully completed Fourth Report item: `F4-052`' in Path('work/APPLICATION-STATE.md').read_text(encoding='utf-8')
          assert 'Next Fourth Report item: `F4-053`' in Path('work/APPLICATION-STATE.md').read_text(encoding='utf-8')
          assert 'F4-048–052 checkpoint — PASS' in Path('work/VALIDATION-LOG.md').read_text(encoding='utf-8')
          assert 'DO-NOT-REPEAT: `F4-001`–`F4-052`' in Path('work/NEXT-HANDOFF.md').read_text(encoding='utf-8')
          PY
      - name: Commit checkpoint
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add work/application-ledger.jsonl work/APPLICATION-STATE.md work/VALIDATION-LOG.md work/NEXT-HANDOFF.md
          git commit -m 'checkpoint(application): complete F4-048-052 [skip ci]'
          git push origin HEAD:editorial/apply-fourth-fifth-reports
