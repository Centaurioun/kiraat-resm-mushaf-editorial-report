name: application-batch

on:
  push:
    branches:
      - editorial/apply-fourth-fifth-reports
    paths:
      - 'work/BATCH-REQUEST.json'
  pull_request:
    branches:
      - editorial/apply-fourth-fifth-reports
    paths:
      - 'work/BATCH-REQUEST.json'

permissions:
  contents: write

jobs:
  apply:
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: editorial/apply-fourth-fifth-reports
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install lxml
      - name: Apply requested deterministic batch twice
        id: deterministic
        continue-on-error: true
        run: |
          set -euo pipefail
          mkdir -p /tmp/app work/runtime artifacts/checkpoints
          python - <<'PY'
          import json,hashlib,subprocess,sys,traceback
          from pathlib import Path
          req=json.loads(Path('work/BATCH-REQUEST.json').read_text(encoding='utf-8'))
          diag=Path('work/runtime')/f"{req['checkpoint']}-BATCH-DIAGNOSTIC.txt"
          try:
              inp=Path(req['input_docx']); got=hashlib.sha256(inp.read_bytes()).hexdigest()
              if got != req['input_sha256']: raise RuntimeError(f'input SHA mismatch: {got} != {req["input_sha256"]}')
              out=Path('/tmp/app/out.docx'); rer=Path('/tmp/app/rerun.docx')
              first=subprocess.run([sys.executable,req['script'],str(inp),str(out)],capture_output=True,text=True)
              if first.returncode:
                  raise RuntimeError('FIRST_REPLAY_FAILED\nSTDOUT:\n'+first.stdout+'\nSTDERR:\n'+first.stderr)
              second=subprocess.run([sys.executable,req['script'],str(out),str(rer)],capture_output=True,text=True)
              if second.returncode:
                  raise RuntimeError('SECOND_REPLAY_FAILED\nSTDOUT:\n'+second.stdout+'\nSTDERR:\n'+second.stderr)
              if out.read_bytes()!=rer.read_bytes(): raise RuntimeError('idempotency failure: second replay differs')
              sha=hashlib.sha256(out.read_bytes()).hexdigest()
              dest=Path(req['output_docx']); dest.parent.mkdir(parents=True,exist_ok=True); dest.write_bytes(out.read_bytes())
              sha_file=Path(req['sha_file']); sha_file.parent.mkdir(parents=True,exist_ok=True); sha_file.write_text(sha+'\n',encoding='utf-8')
              replay_file=req.get('replay_file')
              if replay_file:
                  Path(replay_file).parent.mkdir(parents=True,exist_ok=True)
                  Path(replay_file).write_text('FIRST_REPLAY_STDOUT\n'+first.stdout+'\nSECOND_REPLAY_STDOUT\n'+second.stdout+'\nBYTE_IDENTICAL=PASS\n',encoding='utf-8')
              if diag.exists(): diag.unlink()
          except Exception:
              diag.parent.mkdir(parents=True,exist_ok=True)
              diag.write_text(traceback.format_exc(),encoding='utf-8')
              raise
          PY
      - name: Commit batch failure diagnostic
        if: steps.deterministic.outcome == 'failure'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          checkpoint=$(python -c "import json;print(json.load(open('work/BATCH-REQUEST.json'))['checkpoint'])")
          diag="work/runtime/${checkpoint}-BATCH-DIAGNOSTIC.txt"
          if [ -f "$diag" ]; then
            git add "$diag"
            git commit -m "diagnostic(runtime): persist ${checkpoint} batch failure [skip ci]" || true
            git push origin HEAD:editorial/apply-fourth-fifth-reports
          fi
      - name: Fail after diagnostic persistence
        if: steps.deterministic.outcome == 'failure'
        run: exit 1
      - name: Write current-range postflight
        if: steps.deterministic.outcome == 'success'
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from zipfile import ZipFile
          from lxml import etree
          req=json.loads(Path('work/BATCH-REQUEST.json').read_text(encoding='utf-8'))
          W='http://schemas.openxmlformats.org/wordprocessingml/2006/main'; NS={'w':W}
          p=Path(req['output_docx'])
          with ZipFile(p) as z:
              d=etree.fromstring(z.read('word/document.xml')); f=etree.fromstring(z.read('word/footnotes.xml')); ps=d.xpath('.//w:body/w:p',namespaces=NS)
              lines=[f'DOCX={p}',f'BODY_PARAGRAPHS={len(ps)}']; note_ids=set()
              for i in range(max(0,int(req['postflight_start'])),min(len(ps),int(req['postflight_end'])+1)):
                  q=ps[i]; text=''.join(q.xpath('.//w:t/text()',namespaces=NS)); fns=q.xpath('.//w:footnoteReference/@w:id',namespaces=NS); note_ids.update(fns)
                  lines.append(f'P{i}\tFN={fns}\tRTL={len(q.xpath(".//w:rtl",namespaces=NS))}\tFLD={len(q.xpath(".//w:instrText|.//w:fldChar",namespaces=NS))}\tBOOK={len(q.xpath(".//w:bookmarkStart|.//w:bookmarkEnd",namespaces=NS))}\t{text}')
              lines.append('\nFOOTNOTES')
              for fid in sorted(note_ids,key=lambda x:int(x)):
                  hit=f.xpath(f'.//w:footnote[@w:id="{fid}"]',namespaces=NS)
                  if hit: lines.append(f'FN{fid}\t'+''.join(hit[0].xpath('.//w:t/text()',namespaces=NS)))
          out=Path(req['postflight_file']); out.parent.mkdir(parents=True,exist_ok=True); out.write_text('\n'.join(lines),encoding='utf-8')
          PY
      - name: Run optional validation report
        if: steps.deterministic.outcome == 'success'
        run: |
          set -euo pipefail
          has=$(python -c "import json;print('yes' if json.load(open('work/BATCH-REQUEST.json')).get('validator_script') else 'no')")
          if [ "$has" = no ]; then exit 0; fi
          script=$(python -c "import json;print(json.load(open('work/BATCH-REQUEST.json'))['validator_script'])")
          docx=$(python -c "import json; r=json.load(open('work/BATCH-REQUEST.json')); print(r.get('validator_input',r['output_docx']))")
          out=$(python -c "import json;print(json.load(open('work/BATCH-REQUEST.json'))['validator_file'])")
          python "$script" "$docx" "$out"
      - name: Commit candidate and evidence
        if: steps.deterministic.outcome == 'success'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          python - <<'PY' > /tmp/paths
          import json
          r=json.load(open('work/BATCH-REQUEST.json'))
          for k in ('output_docx','sha_file','postflight_file','replay_file','validator_file'):
              if r.get(k): print(r[k])
          PY
          while read -r p; do git add "$p"; done < /tmp/paths
          if git diff --cached --quiet; then exit 0; fi
          checkpoint=$(python -c "import json;print(json.load(open('work/BATCH-REQUEST.json'))['checkpoint'])")
          git commit -m "checkpoint(runtime): persist ${checkpoint} candidate [skip ci]"
          git push origin HEAD:editorial/apply-fourth-fifth-reports
